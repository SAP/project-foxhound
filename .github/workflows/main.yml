# This is a basic workflow to help you get started with Actions

name: JavaScript

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build:
    strategy:
      matrix:
        taintspew: [ 'false', 'true' ]
        jitspew:   [ 'false', 'true' ]

    name: 'SpiderMonkey (taintspew: ${{ matrix.taintspew }}, jitspew: ${{ matrix.jitspew }})'

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Make sure all versions run to end
    continue-on-error: true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Update
        run: |
          sudo apt-get update
          pip install junit-xml

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy Configuration
        run: |
          cp taintfox_mozconfig_spidermonkey .mozconfig
    
      - name: Enable JitSpew
        if: ${{ matrix.jitspew == 'true' }}
        run: echo "ac_add_options --enable-jitspew" >> .mozconfig

      - name: Enable TaintSpew
        if: ${{ matrix.taintspew == 'true' }}
        run: echo "ac_add_options --enable-taintspew" >> .mozconfig
        
      - name: Bootstrap Build Tools
        run: |
          ./mach --no-interactive bootstrap --application-choice=js

      - name: Install Rust
        run: |
          RUST_VERSION=$(grep '^RUST_VERSION=' .PLAYWRIGHT_VERSION | cut -d'"' -f2)
          if ! echo "${RUST_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid RUST_VERSION: ${RUST_VERSION}" && exit 1
          fi
          echo "Installing ${RUST_VERSION} from .PLAYWRIGHT_VERSION"
          rustup install "${RUST_VERSION}"
          rustup default "${RUST_VERSION}"

      # Build
      - name: Build
        run: |
          ./mach build

      # Test
      - name: Test
        run:  |
          obj-spider-release/dist/bin/js js/src/Y.js

      - name: Taint Tests
        run:  |
          python3 js/src/tests/parse_output.py

      - name: Print Test Summary
        if:  ${{ (success() || failure()) }} # run this step even if previous step failed
        run: |
          echo "STDOUT: "
          cat ./jstest_dump.txt
          echo "STDERR: "
          cat ./jstest_stderr.txt
          cat ./jstest_output.md >> $GITHUB_STEP_SUMMARY

      # Both known failures expect strings to be stored out of line, but
      # Foxhound's larger inline string storage (NUM_INLINE_CHARS_* in
      # js/src/vm/StringType.h) makes them fit inline.
      - name: JSAPI Tests
        if:  ${{ (success() || failure()) }} # run this step even if previous step failed
        env:
          KNOWN_FAILURES: testStringBuffersLatin1|testExternalStringsUTF8
        run: |
          ./mach jsapi-tests > jsapi_output.txt 2>&1 || true
          cat jsapi_output.txt
          if ! grep -qE '^(Passed: ran [0-9]+ tests\.|[0-9]+ unexpected failures?\.)$' jsapi_output.txt; then
            echo "jsapi-tests did not finish" | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi
          unexpected=$(grep '^TEST-UNEXPECTED-FAIL' jsapi_output.txt | grep -vE "^TEST-UNEXPECTED-FAIL \| (${KNOWN_FAILURES}) \|" || true)
          if [ -n "${unexpected}" ]; then
            { echo "### Unexpected jsapi-tests failures"; echo '```'; echo "${unexpected}"; echo '```'; } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Report
        uses: actions/upload-artifact@v4  # upload test results
        if:  ${{ matrix.taintspew == 'false' &&  matrix.jitspew == 'false' && (success() || failure()) }} # run this step even if previous step failed
        with:
          name: test-results
          path: jstest_output.xml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4  # upload test results
        if:  ${{ matrix.taintspew == 'false' &&  matrix.jitspew == 'false' && (success() || failure()) }} # run this step even if previous step failed
        with:
          name: spidermonkey
          path: obj-spider-release/dist/bin
