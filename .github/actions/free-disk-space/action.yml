name: Free Disk Space
description: >
  Inlined from https://github.com/jlumbroso/free-disk-space — removes large
  pre-installed packages to reclaim disk space on Ubuntu runners.

runs:
  using: composite
  steps:
    - run: |
        sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc /usr/local/.ghcup
        sudo apt-get remove -y --fix-missing '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
        sudo apt-get autoremove -y || true
        sudo apt-get clean
        sudo docker image prune --all --force || true
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile
        df -h
      shell: bash
