defaultPref("browser.startup.homepage", "data:text/plain,browser.startup.homepage=http://www.example.com/");

// Verify the same wrapper on any other pref is left untouched
defaultPref("_autoconfig_.test.datapref", "data:text/plain,_autoconfig_.test.datapref=datapref");

// Verify this one is locked
lockPref("_autoconfig_.test.lockpref", "lockpref");

lockPref("_autoconfig_.test.unlockpref", "unlockpref");
